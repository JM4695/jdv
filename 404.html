<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JDV" />
    <title>Jongmin Dain Vault</title>
    <!-- 첫 그림부터 앱 바탕색·테마로: CSS 번들이 오기 전 흰 화면·상단 흰 줄이 번쩍이던 것을 막는다 -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('jdv.preferences') || '{}').theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var color = theme === 'dark' ? '#0F1114' : '#E9ECEF';   // 상태 표시줄도 고른 테마로(기기 설정과 다를 때)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.setAttribute('content', color); });
        }
      } catch (error) { /* 저장소 막힘: 기기 설정을 따른다 */ }
    </script>
    <style>html{background:#e9ecef}@media (prefers-color-scheme:dark){html:not([data-theme=light]){background:#0f1114}}html[data-theme=dark]{background:#0f1114}html[data-theme=light]{background:#e9ecef}body{margin:0}.boot{place-items:center;display:grid;position:fixed;inset:0}.boot img{border-radius:22px;width:84px;height:84px;animation:.5s cubic-bezier(.2,.8,.2,1) both boot-in}@keyframes boot-in{0%{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}#boot-intro{z-index:50;background:#0f1114;transition:opacity .4s .1s}#boot-intro img{border-radius:42px;width:168px;height:168px;transition:transform .5s cubic-bezier(.5,0,.2,1);animation:none}#boot-intro.open{opacity:0;pointer-events:none}#boot-intro.open img{transform:scale(1.4)}@media (prefers-reduced-motion:reduce){#boot-intro img{visibility:hidden}}</style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'" />
    <script type="module" crossorigin src="/jdv/assets/index-BH_7fX8K.js"></script>
    <link rel="stylesheet" crossorigin href="/jdv/assets/index-CfiamsWA.css">
  </head>
  <body>
    <div id="root"><div class="boot"><img src="icons/icon-192.png?v=2" alt="" /></div></div>
    <div id="boot-intro" class="boot intro" aria-hidden="true"><img src="icons/boot-dial.svg?v=2" alt="" /></div>
    <script>
      setTimeout(function () {
        var intro = document.getElementById("boot-intro");
        intro.classList.add("open");
        setTimeout(function () { intro.remove(); window.jdvIntroDone = true; window.dispatchEvent(new Event("jdv:intro-done")); }, 550);
      }, 2300);
    </script>
  </body>
</html>
